name: Release image

# Publishes ghcr.io/<owner>/artgallery:latest on every push to main and weekly,
# so servers running deploy/auto-update.sh pick up dependency and OS patches.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - run: pip install -r requirements-dev.txt && pytest -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/artgallery:latest
            ghcr.io/${{ github.repository_owner }}/artgallery:${{ github.sha }}
