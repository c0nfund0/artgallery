name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"   # daily: catch newly published CVEs in pinned deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --strict

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --pull -t artgallery:ci .
      - name: Smoke test
        run: |
          docker run -d --name g -p 8000:8000 artgallery:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs g; exit 1
      - name: Scan image for OS/library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: artgallery:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
