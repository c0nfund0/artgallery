services:
  gallery:
    # Use the image built by CI (auto-rebuilt weekly and on every dependency update),
    # or comment `image` and use `build: .` to build locally.
    image: ${GALLERY_IMAGE:-ghcr.io/OWNER/artgallery:latest}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - gallery-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  gallery-data:
