# nginx site for the gallery. Install with:
#   sudo cp deploy/nginx/art.luodot.com.conf /etc/nginx/sites-available/art.luodot.com
#   sudo ln -s /etc/nginx/sites-available/art.luodot.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d art.luodot.com
# certbot rewrites this file: it adds the :443 server block with the certificate
# and turns this block into an HTTP -> HTTPS redirect. Renewal is automatic.

server {
    listen 80;
    listen [::]:80;
    server_name art.luodot.com;

    # Uploads: keep in sync with MAX_UPLOAD_MB (+ form overhead).
    client_max_body_size 30m;

    # Streams uploads straight to the app instead of buffering to disk first.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for appends the real client IP as the LAST
        # entry; the app trusts exactly one hop, so a spoofed header from the
        # client is ignored.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
    }
}
