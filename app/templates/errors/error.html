{% extends "base.html" %}
{% block title %}{{ code }} · {{ site_name }}{% endblock %}
{% block content %}
<section class="wrap narrow center error-page">
  <p class="error-code">{{ code }}</p>
  <h1 class="page-title">{{ message }}</h1>
  <p><a class="btn btn-primary" href="{{ url_for('gallery.index') }}">Back to the gallery</a></p>
</section>
{% endblock %}
